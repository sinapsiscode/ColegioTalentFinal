<!DOCTYPE html>
<html>
<head>
    <title>Clear DB</title>
</head>
<body>
    <h1>Limpiar Base de Datos</h1>
    <button onclick="clearDB()">Limpiar localStorage</button>
    <div id="result"></div>
    
    <script>
        function clearDB() {
            // Limpiar toda la base de datos
            localStorage.removeItem('TalentosCollegeDB');
            
            // Limpiar todos los backups
            const keys = Object.keys(localStorage);
            keys.forEach(key => {
                if (key.startsWith('TalentosCollegeDB_backup_')) {
                    localStorage.removeItem(key);
                }
            });
            
            document.getElementById('result').innerHTML = '<p style="color: green;">Base de datos limpiada exitosamente. Puedes cerrar esta ventana y recargar la aplicación.</p>';
        }
    </script>
</body>
</html>
